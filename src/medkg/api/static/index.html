<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Medical GraphRAG</title>
  <style>
    :root {
      --background: #f4f6f5;
      --surface: #ffffff;
      --text: #14211f;
      --muted: #55625f;
      --border: #d3dcd9;
      --accent: #146653;
      --accent-text: #ffffff;
      --soft: #e8f1ed;
      --bubble: #dcebe4;
      --chip: #f1f5f3;
      --caution: #fff4cc;
      --caution-edge: #c79100;
      --caution-text: #4d3a00;
      --urgent: #fde8e8;
      --urgent-edge: #c0302b;
      --urgent-text: #6b1410;
      --error: #a42b2b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111b19;
        --surface: #182522;
        --text: #eef5f2;
        --muted: #adbdb7;
        --border: #34483f;
        --accent: #9adfc0;
        --accent-text: #10271e;
        --soft: #22362f;
        --bubble: #27443a;
        --chip: #1f312b;
        --caution: #3a3117;
        --caution-edge: #e0b23c;
        --caution-text: #f6e2a6;
        --urgent: #3d1c1b;
        --urgent-edge: #f07a73;
        --urgent-text: #ffd2cf;
        --error: #ffaaa5;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main { max-width: 860px; margin: 0 auto; padding: 40px 24px 0; }
    h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 2.6rem); letter-spacing: -0.03em; }
    .subtitle { margin: 6px 0 22px; color: var(--muted); }
    .notice {
      margin: 0 0 24px;
      padding: 10px 14px;
      border-left: 4px solid var(--caution-edge);
      border-radius: 6px;
      background: var(--caution);
      color: var(--caution-text);
      font-size: 0.9rem;
    }
    .section-label { margin: 0 0 10px; font-size: 0.9rem; font-weight: 650; }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    button, input { font: inherit; }
    button {
      max-width: 100%;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    button:hover:not(:disabled) { border-color: var(--accent); background: var(--soft); }
    button:disabled { opacity: 0.55; cursor: wait; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .examples button { text-align: left; font-size: 0.85rem; }
    form { display: flex; align-items: stretch; gap: 10px; }
    form input { flex: 1; }
    .composer-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .link {
      padding: 2px 4px;
      border: 0;
      background: none;
      color: var(--accent);
      font-size: 0.85rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .link:hover:not(:disabled) { background: none; }
    label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 650; }
    input {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
    }
    #ask { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    #conversation { margin-top: 8px; }
    .turn { margin-top: 32px; min-width: 0; }
    /* The question box stays at the bottom of the window, as in a chat. */
    .composer {
      position: sticky;
      bottom: 0;
      z-index: 2;
      margin: 28px -24px 0;
      padding: 14px 24px 18px;
      border-top: 1px solid var(--border);
      background: var(--background);
    }
    /* The question as a chat message on the right; how it was read just below it. */
    .question {
      width: fit-content;
      max-width: min(85%, 600px);
      margin: 0 0 6px auto;
      padding: 10px 16px;
      border-radius: 18px 18px 4px 18px;
      background: var(--bubble);
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .reading { margin: 0 0 4px auto; max-width: min(85%, 600px); color: var(--muted); font-size: 0.85rem; text-align: right; }
    .reading b { font-weight: 600; }
    .result {
      margin-top: 12px;
      padding: 24px 28px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      min-width: 0;
    }
    /* Answers are set for reading: larger type at full contrast, lines of about 70 characters. */
    .answer, .summary, .chips, .callout, .more { max-width: 70ch; }
    .answer { font-size: 1.0625rem; line-height: 1.65; overflow-wrap: anywhere; }
    .answer > :first-child { margin-top: 0; }
    .answer > :last-child { margin-bottom: 0; }
    .answer p { margin: 0 0 12px; }
    .answer h3 { margin: 18px 0 6px; font-size: 1.0625rem; font-weight: 700; }
    .answer ul, .answer ol { margin: 0 0 12px; padding-left: 1.4em; }
    .answer li + li { margin-top: 4px; }
    .answer li ul { margin: 4px 0 0; }
    .answer ul.chips { padding-left: 0; }
    .answer ul.chips li + li { margin-top: 0; }
    .answer .list-tools { margin: -4px 0 12px; }
    .answer strong, .summary { font-weight: 700; }
    .summary { margin: 0 0 14px; font-size: 1.125rem; line-height: 1.5; }
    /* A list from the graph is shown as names to scan, not as a long column. */
    .chips {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .chips li {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--chip);
      font-size: 0.95rem;
      line-height: 1.35;
      overflow-wrap: break-word;
    }
    .chips li.disputed { border-color: var(--caution-edge); }
    .chips li.disputed::after { content: " ⚑"; color: var(--caution-edge); }
    .chips li[hidden] { display: none; }
    .list-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 10px; }
    .list-tools .link { padding-left: 0; }
    .more { margin: 0; color: var(--muted); font-size: 0.9rem; }
    /* Callouts, as on health information sites: amber to take care, red to act now. */
    .callout {
      margin: 0 0 16px;
      padding: 12px 16px;
      border-left: 5px solid var(--caution-edge);
      border-radius: 6px;
      background: var(--caution);
      color: var(--caution-text);
      font-size: 1rem;
    }
    .callout strong { display: block; margin-bottom: 2px; }
    .callout ul { margin: 4px 0 0; padding-left: 1.2em; }
    .callout.urgent { border-left-color: var(--urgent-edge); background: var(--urgent); color: var(--urgent-text); font-size: 1.0625rem; }
    .chips + .callout, .list-tools + .callout { margin-top: 16px; }
    .confirm {
      margin-top: 16px;
      padding: 14px 16px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      background: var(--soft);
    }
    .confirm p { margin: 0 0 10px; font-size: 1.05rem; font-weight: 650; }
    /* Options are stacked in the order they are ranked, the likeliest first (D108, D118). */
    .confirm .choices { display: flex; flex-direction: column; align-items: stretch; gap: 8px; max-width: 560px; }
    .confirm .choices button { text-align: left; }
    .confirm .choices + .choices { margin-top: 8px; }
    .confirm .choose { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    /* Filled buttons keep their colours on hover; the plain hover background hid their text. */
    #ask:hover:not(:disabled), .confirm .choose:hover:not(:disabled) {
      background: var(--accent); color: var(--accent-text); filter: brightness(1.15);
    }
    .confirm.other { border-width: 1px; border-color: var(--border); background: transparent; }
    .confirm.other p { font-size: 0.95rem; font-weight: 600; color: var(--muted); }
    .confirm p:last-child { margin-bottom: 0; }
    .thinking { color: var(--muted); }
    h3.label { margin: 22px 0 8px; color: var(--muted); font-size: 0.8rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; }
    /* Sources as numbered cards: the document title links to it. */
    .sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
    .sources li {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--background);
      font-size: 0.9rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .sources .number {
      flex: none;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      background: var(--soft);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.5rem;
      text-align: center;
    }
    .sources a { color: var(--accent); font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
    .sources .kind, .sources .sections { display: block; color: var(--muted); font-size: 0.85rem; }
    .related { display: flex; flex-wrap: wrap; gap: 8px; }
    .related button { border-radius: 18px; font-size: 0.9rem; }
    .related button::before { content: "→ "; color: var(--accent); }
    .disclaimer { margin: 18px 0 0; color: var(--muted); font-size: 0.8rem; }
    .error { color: var(--error); }
    /* Route, status, time and model calls, in one quiet line. */
    .badges { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; color: var(--muted); font-size: 0.78rem; }
    .badge + .badge::before { content: "·"; margin-right: 14px; }
    .route { color: var(--accent); font-weight: 650; }
    details { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; font-weight: 650; }
    .how h4 { margin: 16px 0 0; color: var(--muted); font-size: 0.85rem; }
    .query + .query { margin-top: 20px; }
    .description { margin: 12px 0 8px; overflow-wrap: anywhere; }
    .cypher { white-space: pre-wrap; overflow-wrap: anywhere; }
    pre {
      max-width: 100%;
      overflow-x: auto;
      padding: 12px;
      margin: 12px 0 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--background);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-variant-ligatures: none;
      font-size: 0.8rem;
      line-height: 1.65;
    }
    .table-scroll { max-width: 100%; overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--border); }
    td { overflow-wrap: anywhere; min-width: 72px; }
    th { color: var(--muted); font-weight: 650; }
    @media (max-width: 480px) {
      main { padding: 24px 16px 0; }
      .result { padding: 18px 16px; }
      .question, .reading { max-width: 92%; }
      /* On a phone the names wrap as pills sized to their text, so no word is cut. */
      .chips { display: flex; flex-wrap: wrap; }
      .chips li { max-width: 100%; }
      .composer { margin: 24px -16px 0; padding: 12px 16px 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Medical GraphRAG</h1>
      <p class="subtitle">Answers from a medical knowledge graph (PrimeKG in Neo4j), with the evidence behind them.</p>
    </header>
    <p class="notice" role="note">Research demo, not medical advice. Do not use it to diagnose, choose doses or make treatment decisions.</p>
    <div id="welcome">
    <p class="section-label" id="examples-label">Try a question</p>
    <div class="examples" role="group" aria-labelledby="examples-label">
      <button type="button">What is Lipitor used for?</button>
      <button type="button">What are the side effects of metformin?</button>
      <button type="button">Which drugs used for migraine interact with fluoxetine?</button>
      <button type="button">Which genes are associated with cystic fibrosis?</button>
      <button type="button">Does warfarin interact with aspirin?</button>
      <button type="button">How much ibuprofen should I give my 5-year-old?</button>
    </div>
    </div>
    <section id="conversation" aria-label="Conversation"></section>
    <div class="composer">
      <div class="composer-head">
        <label for="question">Your question</label>
        <button id="new-conversation" class="link" type="button">New conversation</button>
      </div>
      <form id="question-form">
        <input id="question" name="question" type="text" maxlength="4096" required autocomplete="off"
               placeholder="Ask about a drug, disease, symptom or gene">
        <button id="ask" type="submit">Ask</button>
      </form>
    </div>
  </main>
  <script>
    "use strict";

    const form = document.getElementById("question-form");
    const input = document.getElementById("question");
    const conversation = document.getElementById("conversation");
    const welcome = document.getElementById("welcome");
    const composer = document.querySelector(".composer");
    const routeNames = new Map([
      ["template", "Graph query"], ["planner", "LLM planner"],
      ["vector", "Text search"], ["safety", "Safety gate"],
      ["language", "Language gate"], ["scope", "Scope gate"],
      ["linking", "Clarification"], ["intent", "Which question?"]
    ]);
    // Safety replies that ask the reader to get help now are shown in red.
    const urgent = new Set(["crisis", "emergency", "possible_emergency"]);
    const SHOWN = 12;   // names of a list shown before "Show all"
    let history = [];
    let pending = false;

    function element(tag, className = "", text = "") {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = text;
      return node;
    }

    function details(card, title, open = false) {
      const section = element("details");
      section.open = open;
      section.append(element("summary", "", title));
      card.append(section);
      return section;
    }

    function table(section, headings, rows) {
      const wrapper = element("div", "table-scroll");
      const grid = element("table");
      const head = element("thead");
      const header = element("tr");
      for (const heading of headings) {
        const cell = element("th", "", heading);
        cell.scope = "col";
        header.append(cell);
      }
      head.append(header);
      grid.append(head);
      const body = element("tbody");
      for (const row of rows) {
        const line = element("tr");
        for (const value of row) line.append(element("td", "", value ?? ""));
        body.append(line);
      }
      grid.append(body);
      wrapper.append(grid);
      section.append(wrapper);
    }

    function ask(question) {
      input.value = question;
      form.requestSubmit();
    }

    function replaceMention(question, mention, name) {
      // The confirmed name replaces what was typed; mentions are matched case-insensitively.
      const escaped = mention.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\W+");
      const pattern = new RegExp(`(?<!\\w)${escaped}(?!\\w)`, "i");
      return pattern.test(question) ? question.replace(pattern, name) : `${question} (${name})`;
    }

    function confirmBox(card, result, question) {
      // D105: a corrected name is confirmed by the user before anything is answered.
      const box = element("div", "confirm");
      box.setAttribute("role", "group");
      for (const group of result.suggestions) {
        const options = group.options ?? [];
        box.append(element("p", "", options.length === 1
          ? `Did you mean “${options[0].name}”? You wrote “${group.mention}”.`
          : `Did you mean one of these? You wrote “${group.mention}”.`));
        const choices = element("div", "choices");
        for (const option of options) {
          const button = element("button", "choose", `Yes, ${option.name} (${option.label})`);
          button.type = "button";
          button.addEventListener("click", () => ask(replaceMention(question, group.mention, option.name)));
          choices.append(button);
        }
        box.append(choices);
      }
      const none = element("button", "", "None of these");
      none.type = "button";
      none.addEventListener("click", () => retype(box, "Please type the name again, or rephrase the question.",
                                                  question, result.suggestions[0]?.mention));
      box.append(element("div", "choices"));
      box.lastChild.append(none);
      card.append(box);
    }

    function intentBox(card, result, question) {
      // D108: when no rule fits, the model's reading of the question is confirmed. A spread
      // reading is a choice; a clear one was answered, and the other questions are offered.
      const asking = result.route === "intent";
      const box = element("div", asking ? "confirm" : "confirm other");
      box.setAttribute("role", "group");
      box.append(element("p", "", asking ? "Which question do you mean?" : "Not what you asked? Ask instead:"));
      const choices = element("div", "choices");
      for (const option of result.intent_options) {
        const button = element("button", asking ? "choose" : "", option.question);
        button.type = "button";
        button.addEventListener("click", () => ask(option.question));
        choices.append(button);
      }
      if (asking) {
        const other = element("button", "", "Something else");
        other.type = "button";
        other.addEventListener("click", () => retype(box, "Please rephrase the question.", question));
        choices.append(other);
      }
      box.append(choices);
      card.append(box);
    }

    function retype(box, message, question, part) {
      // "None of these" / "Something else": nothing further is guessed. The question is put
      // back in the box to rephrase, with the unmatched name selected when there is one.
      box.className = "confirm other";
      box.replaceChildren(element("p", "", message));
      input.value = question;
      input.focus();
      const at = part ? question.toLowerCase().indexOf(part.toLowerCase()) : -1;
      if (at >= 0) input.setSelectionRange(at, at + part.length); else input.select();
    }

    function reveal(turn) {
      // Like a chat: a reply that fits is shown whole just above the question box, a longer
      // one from its question down. The page moves only as far as it needs to.
      const visible = window.innerHeight - composer.getBoundingClientRect().height;
      const box = turn.getBoundingClientRect();
      const by = box.height + 24 <= visible ? box.bottom - visible + 12 : box.top - 16;
      if (by > 0) window.scrollBy({top: by, behavior: "smooth"});
    }

    const sourceNames = new Map([
      ["medlineplus", "MedlinePlus"], ["openfda", "FDA drug label"],
      ["primekg", "PrimeKG knowledge graph"], ["openfda_extracted", "FDA drug label (extracted relation)"]
    ]);

    function sourcesBlock(sources) {
      // One numbered card per document: its title as a link, where it is from and the sections used.
      const list = element("ol", "sources");
      sources.forEach((source, index) => {
        const item = element("li");
        const text = element("div");
        const kind = sourceNames.get(source.source) ?? source.source ?? "";
        if (source.url && source.url.startsWith("https://")) {
          const link = element("a", "", source.title || kind);
          link.href = source.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          text.append(link, element("span", "kind", kind));
        } else {
          text.append(element("span", "", kind));
        }
        if (source.sections?.length) text.append(element("span", "sections", source.sections.join(" · ")));
        item.append(element("span", "number", String(index + 1)), text);
        list.append(item);
      });
      return list;
    }

    function inlineParts(text) {
      // **bold** spans are marked; everything else stays text, never HTML.
      return text.split(/\*\*([^*\n]+)\*\*/).map((part, i) => [i % 2 ? "strong" : "text", part])
        .filter(([, part]) => part);
    }

    function answerBlocks(text) {
      // The answer's light Markdown as data: paragraphs (line breaks kept), headings (a line
      // that is all bold, or "#"), and bulleted or numbered lists with one nested level.
      const blocks = [];
      let paragraph = [];
      const flush = () => {
        if (paragraph.length) blocks.push({type: "p", lines: paragraph.map(inlineParts)});
        paragraph = [];
      };
      for (const line of text.split("\n")) {
        const heading = line.match(/^\s*(?:#{1,6}\s+(.+?)|\*\*([^*\n]+?):?\*\*:?)\s*$/);
        const item = line.match(/^(\s*)(?:[*\-•]|(\d+)[.)])\s+(.*\S)\s*$/);
        if (!line.trim()) {
          flush();
        } else if (heading) {
          flush();
          blocks.push({type: "h", parts: inlineParts(heading[1] ?? heading[2])});
        } else if (item) {
          flush();
          // Items separated by blank lines stay one list, so its numbering continues.
          let list = blocks.at(-1);
          const nested = item[1].length >= 2 && list?.type === "list" && list.items.length;
          if (nested) {
            list.items.at(-1).children.push(inlineParts(item[3]));
          } else {
            if (list?.type !== "list" || list.ordered !== Boolean(item[2])) {
              blocks.push(list = {type: "list", ordered: Boolean(item[2]), items: []});
            }
            list.items.push({parts: inlineParts(item[3]), children: []});
          }
        } else {
          paragraph.push(line.trim());
        }
      }
      flush();
      return blocks;
    }

    function inline(node, parts) {
      for (const [kind, part] of parts) {
        node.append(kind === "strong" ? element("strong", "", part) : document.createTextNode(part));
      }
      return node;
    }

    function answerBlock(text) {
      // Elements and text nodes only: the answer is never parsed as HTML.
      const block = element("div", "answer");
      for (const part of answerBlocks(text)) {
        if (part.type === "h") {
          block.append(inline(element("h3"), part.parts));
        } else if (part.type === "p") {
          const paragraph = element("p");
          part.lines.forEach((line, i) => {
            if (i) paragraph.append(element("br"));
            inline(paragraph, line);
          });
          block.append(paragraph);
        } else if (!part.ordered && part.items.length >= 8 && part.items.every(entry => !entry.children.length
                   && entry.parts.length === 1 && entry.parts[0][0] === "text" && entry.parts[0][1].length <= 60)) {
          // A long list of plain names reads better as chips, as a list from the graph does.
          chipGrid(block, part.items.map(entry => ({name: entry.parts[0][1]})));
        } else {
          const list = element(part.ordered ? "ol" : "ul");
          for (const entry of part.items) {
            const item = inline(element("li"), entry.parts);
            if (entry.children.length) {
              const inner = element("ul");
              for (const child of entry.children) inner.append(inline(element("li"), child));
              item.append(inner);
            }
            list.append(item);
          }
          block.append(list);
        }
      }
      return block;
    }

    function chipGrid(parent, items, note = "") {
      // Names as chips, the first twelve shown, with "Show all" for the rest.
      const chips = element("ul", "chips");
      items.forEach((item, index) => {
        const chip = element("li", item.conflict ? "disputed" : "", item.name);
        if (item.conflict) chip.title = "The sources disagree about this record";
        chip.hidden = index >= SHOWN;
        chips.append(chip);
      });
      parent.append(chips);
      const tools = element("div", "list-tools");
      if (items.length > SHOWN) {
        const toggle = element("button", "link", `Show all ${items.length}`);
        toggle.type = "button";
        toggle.setAttribute("aria-expanded", "false");
        toggle.addEventListener("click", () => {
          const open = toggle.getAttribute("aria-expanded") !== "true";
          chips.querySelectorAll("li").forEach((chip, index) => { chip.hidden = !open && index >= SHOWN; });
          toggle.setAttribute("aria-expanded", String(open));
          toggle.textContent = open ? "Show fewer" : `Show all ${items.length}`;
        });
        tools.append(toggle);
      }
      if (note) tools.append(element("p", "more", note));
      if (tools.childElementCount) parent.append(tools);
    }

    function listBlock(card, listing, truncated) {
      // A list from one graph query (D124): the number recorded in bold, then the names.
      card.append(element("p", "summary", listing.summary));
      chipGrid(card, listing.items, listing.total > listing.items.length
        ? `The first ${listing.items.length} of ${listing.total.toLocaleString("en")} by name.`
        : truncated ? "Only part of the available results is listed (retrieval limit reached)." : "");
    }

    function callout(kind, title, text) {
      const box = element("div", `callout ${kind}`);
      box.setAttribute("role", kind === "urgent" ? "alert" : "note");
      if (title) box.append(element("strong", "", title));
      if (Array.isArray(text)) {
        const list = element("ul");
        for (const line of text) list.append(element("li", "", line));
        box.append(list);
      } else {
        box.append(document.createTextNode(text));
      }
      return box;
    }

    function plain(note) {
      // "Note: answered as …" -> "Answered as …"
      const text = note.replace(/^Note:\s*/, "");
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function renderResult(card, result, question) {
      // Leading "Note:" lines (safety notices, how the question was read) are taken out of
      // the answer: readings go under the question, cautions in an amber callout (D125).
      const lines = (result.answer ?? "").split("\n");
      let split = 0;
      while (split < lines.length && lines[split].startsWith("Note:")) split++;
      const kinds = new Map((result.notices ?? []).map(note => [note.text, note.kind]));
      const notes = lines.slice(0, split).map(text => ({text, kind: kinds.get(text) ?? "caution"}));
      const readings = [];
      if (result.read_as) {
        const line = element("p", "reading");
        line.append(element("b", "", "Read as: "), document.createTextNode(result.read_as));
        readings.push(line);
      }
      for (const note of notes.filter(note => note.kind === "reading")) readings.push(element("p", "reading", plain(note.text)));
      card.before(...readings);
      card.replaceChildren();
      const cautions = notes.filter(note => note.kind !== "reading").map(note => plain(note.text));
      if (cautions.length) card.append(callout("", "Please note", cautions.join(" ")));
      // A question back to the user is shown once, in its box with the buttons.
      const askingBack = Boolean(result.suggestions?.length) || result.route === "intent";
      // The sources are listed below the answer, and the disclaimer closes the reply.
      let body = lines.slice(split).join("\n").replace(/^\n+/, "");
      const disclaimer = /\n*Research demo; not medical advice\.\s*$/;
      const closing = disclaimer.test(body);
      body = body.replace(disclaimer, "");
      if (result.sources?.length) body = body.replace(/\n*Sources: [^\n]*\s*$/, "");
      if (result.route === "safety") {
        card.append(callout(urgent.has(result.safety) ? "urgent" : "",
                            urgent.has(result.safety) ? "Get help now" : "This needs a clinician", body));
      } else if (!askingBack && result.listing) {
        listBlock(card, result.listing, result.truncated);
        // Records another source contradicts, each with where it is from.
        const disputed = (result.conflicts ?? []).map(({claim, source}) =>
          `${sourceNames.get(source) ?? source}: ${claim}.`);
        if (!disputed.length && result.listing.items.some(item => item.conflict)) {
          disputed.push("Another source contradicts the records marked ⚑.");
        }
        if (disputed.length) card.append(callout("", "The sources disagree", disputed));
      } else if (!askingBack) {
        card.append(answerBlock(body));
      }
      if (!askingBack && result.sources?.length) {
        card.append(element("h3", "label", "Sources"), sourcesBlock(result.sources));
      }
      if (result.suggestions?.length) confirmBox(card, result, question);
      if (result.intent_options?.length && result.route !== "safety") intentBox(card, result, question);
      if (result.related?.length) {
        // Questions the graph has records for about the same entity (D125).
        const related = element("div", "related");
        for (const option of result.related) {
          const button = element("button", "", option.question);
          button.type = "button";
          button.addEventListener("click", () => ask(option.question));
          related.append(button);
        }
        card.append(element("h3", "label", "Related questions"), related);
      }
      if (closing) card.append(element("p", "disclaimer", "Research demo; not medical advice."));
      const badges = element("div", "badges");
      badges.append(element("span", "badge route", routeNames.get(result.route) ?? result.route ?? ""));
      badges.append(element("span", "badge", askingBack ? "needs your answer" : result.response_status ?? ""));
      badges.append(element("span", "badge", `${Number(result.latency_s ?? 0).toFixed(1)} s`));
      const calls = result.usage?.calls ?? 0;
      badges.append(element("span", "badge", `${calls} LLM call${calls === 1 ? "" : "s"}`));
      card.append(badges);

      // Safety refusals have no expandable sections, including trace metadata (D096).
      if (result.route === "safety") return;

      // How the answer was found, folded: linked names, the graph queries (Cypher, the
      // database's query language), the evidence rows and the trace id.
      const how = details(card, "How this was answered");
      how.classList.add("how");
      if (result.candidates?.length) {
        how.append(element("h4", "", "Linked entities"));
        table(how, ["Mention", "Entity", "Type", "ID", "Match"],
          result.candidates.map(row => [row.mention, row.name, row.label, row.uid, row.method]));
      }
      if (result.queries?.length) {
        how.append(element("h4", "", "Graph queries (Cypher)"));
        for (const query of result.queries) {
          const block = element("div", "query");
          if (query.description) block.append(element("p", "description", query.description));
          block.append(element("pre", "cypher", query.cypher ?? ""));
          block.append(element("pre", "", JSON.stringify(query.params ?? {}, null, 2)));
          how.append(block);
        }
      }
      const rows = (result.contexts ?? []).filter(row => !Object.hasOwn(row, "role"));
      if (rows.length) {
        how.append(element("h4", "", "Evidence rows"));
        table(how, ["Name", "ID", "Source", "Conflict"],
          rows.slice(0, 50).map(row => [row.name, row.uid, row.source, row.conflict ? "yes" : ""]));
        if (rows.length > 50) how.append(element("p", "more", `+${rows.length - 50} more rows`));
      }
      if (result.trace_id) how.append(element("h4", "", "Trace"), element("pre", "", result.trace_id));
    }

    function busy(on) {
      pending = on;
      for (const button of document.querySelectorAll("button")) button.disabled = on;
      input.readOnly = on;
    }

    async function send() {
      const question = input.value.trim();
      if (pending || !question || question.length > 4096) return;
      busy(true);

      const turn = element("article", "turn");
      turn.append(element("h2", "question", question));
      const card = element("div", "result");
      card.setAttribute("aria-busy", "true");
      const thinking = element("div", "thinking", "Thinking… 0 s");
      thinking.setAttribute("role", "status");
      card.append(thinking);
      turn.append(card);
      conversation.append(turn);
      welcome.hidden = true;
      input.value = "";
      reveal(turn);
      const started = performance.now();
      const timer = setInterval(() => {
        thinking.textContent = `Thinking… ${Math.floor((performance.now() - started) / 1000)} s`;
      }, 1000);

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question, history: history.slice(-4)})
        });
        if (response.status !== 200) {
          const message = response.status === 503
            ? "The service is not ready: start Neo4j and check the LLM settings (GET /ready)."
            : `Request failed (HTTP ${response.status}).`;
          card.replaceChildren(element("p", "error", message));
        } else {
          const result = await response.json();
          renderResult(card, result, question);
          history.push({question, focus: result.focus || [], intent: result.intent ?? null});
        }
      } catch {
        card.replaceChildren(element("p", "error", "Could not reach the server."));
      } finally {
        clearInterval(timer);
        card.setAttribute("aria-busy", "false");
        busy(false);
        reveal(turn);
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      send();
    });
    for (const button of document.querySelectorAll(".examples button")) {
      button.addEventListener("click", () => ask(button.textContent));
    }
    document.getElementById("new-conversation").addEventListener("click", () => {
      history = [];
      conversation.replaceChildren();
      welcome.hidden = false;
      input.value = "";
      window.scrollTo({top: 0});
      input.focus();
    });
    if (location.hash.startsWith("#q=")) {
      try {
        ask(decodeURIComponent(location.hash.slice(3)).slice(0, 4096));
      } catch {
        // A malformed fragment leaves the ordinary question form available.
      }
    }
  </script>
</body>
</html>
