[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medkg"
version = "0.1.0"
description = "Evidence-oriented English medical GraphRAG research demo"
requires-python = ">=3.12"
dependencies = [
  "neo4j>=5.26,<6", "openai>=1.30,<3", "python-dotenv>=1,<2",
  "pydantic>=2,<3", "rapidfuzz>=3.6,<4", "tqdm>=4.66,<5",
  "fastembed>=0.7,<1", "numpy>=1.26,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp>=1.27,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[project.scripts]
medkg = "medkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Neo4j instance"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
